name: Nowports
description: >-
  Nowports is a digital freight forwarder for Latin America, offering
  technology-enabled international logistics across ocean, air, and ground freight.
  Its Centraliza platform centralizes shipment tracking, document management, and
  alerts, while adjacent services cover cargo insurance and GPS tracking (Protege)
  and inventory financing and factoring (Financia). Backed by Partech and Y
  Combinator, Nowports serves importers and exporters on major trade routes through
  its authenticated web app at app.nowports.com. As of this profile Nowports
  exposes no public developer API, SDK, or developer portal; access is via its
  authenticated web platform.
